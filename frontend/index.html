<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recenter</title>
    <script>
      // Set the theme before first paint so dark mode doesn't flash light.
      // Saved choice wins; otherwise follow the OS. See src/theme.js.
      ;(function () {
        var saved = null
        try { saved = localStorage.getItem('recenter-theme') } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
